services:
  web:
    restart: always

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker-config/nginx/default.conf.prod:/etc/nginx/conf.d/default.conf
      - ./docker-config/nginx/wp-blog.conf.prod:/etc/nginx/conf.d/wp-blog.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    restart: always

  mariadb:
    restart: always